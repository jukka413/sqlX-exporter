settings:
  db_reconnect_interval: "5m"   # как часто переподключаться к недоступным БД (default: 5m)
  default_db: "main"

# Маппинг: файл с метриками → БД по умолчанию.
# Строка — одна БД, список — файл клонируется для каждой БД.
include_defaults:
  oracle-metrics.yaml:
    - "azdh_oracle"
    - "ir_test_oracle"    # те же запросы выполнятся и для второй Oracle
  mssql-metrics.yaml: "main_mssql"   # одна БД — просто строка
  pg-metrics.yaml: "main"

includes:
  "oracle-metrics.yaml": true
  "mssql-metrics.yaml": true
  "pg-metrics.yaml": true

databases:
  main:
    driver: "pgx"
    url: "postgres://admin:admin123@192.168.1.51:5432/mydb"
    max_conns: 10
    max_idle_conns: 2
    max_conn_lifetime: "1h"
    max_conn_idle_time: "30m"
    health_check_period: "1m"

  somedb:
    driver: "pgx"
    url: "postgres://admin:admin123@192.168.1.51:5432/somedb"
    max_conns: 10
    max_idle_conns: 2
    max_conn_lifetime: "1h"
    max_conn_idle_time: "30m"
    health_check_period: "1m"


  myoracle:
    driver: "oracle"
    url: "oracle://system:oracle@192.168.1.51:1521/xe"
    max_conns: 10
    max_idle_conns: 2
    max_conn_lifetime: "1h"
    max_conn_idle_time: "30m"


  myoracle_tns:
    driver: "oracle"
    url: "oracle+tns:://user:password@/?CONNSTR=(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=myhost)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=myservice)))"
    max_conns: 10
    max_idle_conns: 2
    max_conn_lifetime: "1h"
    max_conn_idle_time: "30m"

  my_mysql:
    driver: "mysql"
    url: "test:test@tcp(192.168.1.51:3306)/testdb?parseTime=true&charset=utf8mb4"
    max_conns: 10
    max_idle_conns: 2
    max_conn_lifetime: "1h"
    max_conn_idle_time: "30m"

  my_mssql:
    driver: "sqlserver"
    url: "sqlserver://sa:Str0ng_Passw0rd!2026@192.168.1.51:1433?database=master"
    max_conns: 10
    max_idle_conns: 2
    max_conn_lifetime: "1h"
    max_conn_idle_time: "30m"

queries:
  query1:
    db: "main"
    sql: "SELECT 14"
    timeout: "5s"
    interval: "30s"
    schedule:
      timezone: "Europe/Moscow"
      at:
        - weekday: "wed, thu"
          time: "03:00, 15:46"
        - weekday: "mon"
          time: "14:39"

  query4:
    db: "main"
    sql: "SELECT 31"
    timeout: "5s"
    interval: "30s"
    labels:
      somelabel: "wtf"

  multiple_queries:
    db: "main"
    sql: "SELECT 31 as first, 'text' as query_label
          UNION ALL
          SELECT 99 as first, 'delete_me' as query_label"
    timeout: "5s"
    interval: "30s"
    value_column: "first"
    labels:
      somelabel: "wtf"

  query3:
    db: "main"
    sql: "SELECT 14 from dual"
    timeout: "5s"
    interval: "30s"

  query2:
    db: "somedb"
    sql: "SELECT 111"
    timeout: "5s"
    interval: "1m"

  oracle_query:
    db: "myoracle"
    sql: "SELECT 14 from dual"
    timeout: "5s"
    interval: "30s"

  mysql_query:
    db: "my_mysql"
    sql: "SELECT 654"
    timeout: "5s"
    interval: "30s"

  mssql_query:
    db: "my_mssql"
    sql: "SELECT 333"
    timeout: "5s"
    interval: "30s"
databases:
  main:
    driver: "pgx"
    url: "postgres://admin:admin123@192.168.1.51:5432/mydb"
    max_conns: 10
    max_idle_conns: 2
    max_conn_lifetime: "1h"
    max_conn_idle_time: "30m"
    health_check_period: "1m"

  somedb:
    driver: "pgx"
    url: "postgres://admin:admin123@192.168.1.51:5432/somedb"
    max_conns: 10
    max_idle_conns: 2
    max_conn_lifetime: "1h"
    max_conn_idle_time: "30m"
    health_check_period: "1m"


  myoracle:
    driver: "oracle"
    url: "oracle://user:password@host:1521/service_name"
    max_conns: 10
    max_idle_conns: 2
    max_conn_lifetime: "1h"
    max_conn_idle_time: "30m"


  myoracle_tns:
    driver: "oracle"
    url: "oracle://user:password@/?CONNSTR=(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=myhost)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=myservice)))"
    max_conns: 10
    max_idle_conns: 2
    max_conn_lifetime: "1h"
    max_conn_idle_time: "30m"

  my_mysql:
    driver: "mysql"
    url: "user:password@tcp(host:3306)/dbname?parseTime=true&charset=utf8mb4"
    max_conns: 10
    max_idle_conns: 2
    max_conn_lifetime: "1h"
    max_conn_idle_time: "30m"

  my_mssql:
    driver: "sqlserver"
    url: "sqlserver://user:password@host:1433?database=dbname"
    max_conns: 10
    max_idle_conns: 2
    max_conn_lifetime: "1h"
    max_conn_idle_time: "30m"

queries:
  query1:
    db: "main"
    sql: "SELECT 14"
    timeout: "5s"
    interval: "30s"
    schedule:
      timezone: "Europe/Moscow"
      at:
        - weekday: "wed, thu"
          time: "03:00, 15:46"
        - weekday: "mon"
          time: "14:39"

  query4:
    db: "main"
    sql: "SELECT 31"
    timeout: "5s"
    interval: "30s"
    labels:
      somelabel: "wtf"

  multiple_queries:
    db: "main"
    sql: "SELECT 31 as first, 'text' as query_label"
    timeout: "5s"
    interval: "30s"
    value_column: "first"
    labels:
      somelabel: "wtf"

  query3:
    db: "main"
    sql: "SELECT 14 from dual"
    timeout: "5s"
    interval: "30s"

  query2:
    db: "somedb"
    sql: "SELECT 111"
    timeout: "5s"
    interval: "1m"
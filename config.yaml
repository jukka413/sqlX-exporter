databases:
  main:
    url: "postgres://admin:admin123@192.168.1.51:5432/mydb"
    max_conns: 10
    min_conns: 2
    max_conn_lifetime: "1h"
    max_conn_idle_time: "30m"
    health_check_period: "1m"

  somedb:
    url: "postgres://admin:admin123@192.168.1.51:5432/somedb"
    max_conns: 10
    min_conns: 2
    max_conn_lifetime: "1h"
    max_conn_idle_time: "30m"
    health_check_period: "1m"

queries:
  query1:
    db: "main"
    sql: "SELECT 14"
    timeout: "5s"
    interval: "30s"
    schedule:
      timezone: "Europe/Moscow"
      at:
        - weekday: "wed"
          time: "03:00"
        - weekday: "mon"
          time: "14:39"

  query4:
    db: "main"
    sql: "SELECT 31"
    timeout: "5s"
    interval: "30s"

  query3:
    db: "main"
    sql: "SELECT 14 from dual"
    timeout: "5s"
    interval: "30s"

  query2:
    db: "somedb"
    sql: "SELECT 111"
    timeout: "5s"
    interval: "1m"
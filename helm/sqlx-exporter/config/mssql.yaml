# default_db применяется только к запросам в этом файле.
queries:
  mssql_active_connections:
    # db не указан — возьмёт "main_mssql" из default_db этого файла
    sql: "SELECT count(1) FROM sys.dm_exec_sessions WHERE is_user_process = 1"
    timeout: "10s"
    interval: "1m"

  mssql_db_is_up:
    sql: "SELECT 1"
    timeout: "5s"
    interval: "30s"
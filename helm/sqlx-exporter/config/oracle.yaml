# default_db применяется только к запросам в этом файле.
# Запросы без явного db: получат "azdh_oracle" автоматически.
# Не затрагивает запросы из других инклюдов или основного конфига.
default_db: "azdh_oracle"

databases:
  azdh_oracle:
    driver: "oracle"
    url: "oracle://user:${ORACLE_DB_PASSWORD}@host:1521/service"
    max_conns: 5
    max_idle_conns: 1
    max_conn_lifetime: "30m"
    max_conn_idle_time: "10m"

queries:
  oracle_active_sessions:
    # db не указан — возьмёт "azdh_oracle" из default_db этого файла
    sql: "SELECT count(1) FROM v$session WHERE status = 'ACTIVE' AND username IS NOT NULL"
    timeout: "10s"
    interval: "1m"

  oracle_db_is_up:
    # db не указан — возьмёт "azdh_oracle" из default_db этого файла
    sql: "SELECT 1 FROM dual"
    timeout: "5s"
    interval: "30s"

  oracle_blocking_sessions:
    # db не указан — возьмёт "azdh_oracle" из default_db этого файла
    sql: "SELECT count(1) FROM v$session WHERE blocking_session IS NOT NULL"
    timeout: "10s"
    interval: "2m"